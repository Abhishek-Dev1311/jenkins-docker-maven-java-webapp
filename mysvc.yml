apiVersion: v1
kind: Service
metadata:
  name: my-service
spec:
  selector:
    app: myd3  # Replace with your app's label selector
  ports:
    - protocol: TCP
      port: 80           # Port on the service
      targetPort: 80      # Port on the container (target port)
      nodePort: 30000     # Port on the node (external access)
  type: NodePort
